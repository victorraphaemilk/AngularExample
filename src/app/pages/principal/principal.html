<section class="hero-section">
    <div class="hero-content">
        <div class="greeting-container">
            <h2 class="greeting">{{GreetingService.stringgs || 'Bom dia'}}</h2>
            <button class="btn-greeting" (click)="trocarGreeting()" title="Mudar Saudação">↻</button>
        </div>
        
        <h1 class="main-title">Descubra Novas <span class="highlight">Receitas</span> Todos os Dias</h1>
        
        <button class="cta-button" [routerLink]="['receitas']">Ver Todas as Receitas</button>
    </div>
    
    <div class="hero-media">
        <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=1000&auto=format&fit=crop" alt="Prato delicioso" class="hero-gif">
    </div>
</section>
